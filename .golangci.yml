# golangci-lint v2 config.
# Migrated from v1 schema: gofmt/goimports переехали в `formatters`,
# gosimple слит в staticcheck, `linters-settings` стал `linters.settings`.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/postfriday/botguard

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
